version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tasklist-postgres
    environment:
      POSTGRES_DB: tasklist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev-services
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tasklist-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - dev-services
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  dev-services:
    driver: bridge

